name: Bug report
description: Report a reproducible problem with Muse Desktop.
body:
  - type: markdown
    attributes:
      value: For security issues, use private vulnerability reporting. Remove credentials, personal paths, and private conversation content before sharing logs or screenshots.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App, Muse Code, and OS versions
      description: Find app and CLI versions in Settings. Include macOS (Apple Silicon or Intel), Windows, or Linux distribution and architecture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
      description: Share only the information needed to reproduce the issue.
