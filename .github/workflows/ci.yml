name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run package:unsigned
      - name: Verify setup without an installed CLI
        run: npx playwright test tests/e2e/setup.spec.ts
      - name: Preserve executable permissions in the app archive
        run: |
          for app in release/mac*/Muse\ Desktop.app; do
            architecture=$(basename "$(dirname "$app")")
            ditto -c -k --sequesterRsrc --keepParent "$app" "release/unsigned-$architecture.zip"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-macos-app
          path: release/unsigned-*.zip
          retention-days: 7
