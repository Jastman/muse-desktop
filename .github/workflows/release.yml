name: Publish signed macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  macos:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Require signing and notarization credentials
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$SPARKLE_PRIVATE_KEY"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run dist -- --config.forceCodeSigning=true
      - name: Verify first-run setup
        run: npx playwright test tests/e2e/setup.spec.ts
      - name: Verify notarized archives and generate signed Sparkle feeds
        run: npm run release:appcast
      - name: Checksum distribution files
        working-directory: release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos-distribution
          path: |
            release/*.dmg
            release/*.zip
            release/appcasts/*.xml
            release/SHA256SUMS.txt
      - name: Publish release, then update the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cat > release/NOTES.md <<'NOTES'
          Unofficial community companion for Muse Code, maintained by Robert Courson. Not affiliated with, endorsed by, sponsored by, or supported by Meta.

          Requires macOS 13+ and a separately installed, authenticated Muse Code CLI. Download the arm64 DMG for Apple Silicon or x64 DMG for Intel, then drag Muse Desktop to Applications. These apps are Developer ID signed and notarized. Sparkle provides signed updates; choose Settings → About to check or opt into daily checks.

          See README, NOTICE.md, and docs/compatibility.md for setup, supported workflows, and asset licensing. SHA256SUMS.txt contains artifact checksums.
          NOTES
          gh release create "$TAG" release/*.dmg release/*.zip release/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title "Muse Desktop $VERSION (Unofficial)" --notes-file release/NOTES.md
          gh release edit "$TAG" --draft=false --latest
          cp release/appcasts/*.xml updates/
          git config user.name 'Robert Courson'
          git config user.email '135086771+robzilla1738@users.noreply.github.com'
          git add updates/
          git commit -m "Publish Sparkle feed for $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
